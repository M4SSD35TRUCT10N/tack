name: tack-self-hosted-ci

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  # Do not enable pull_request for unreviewed code on self-hosted runners.

permissions:
  contents: read

jobs:
  linux-arm64:
    name: Linux ARM64 (pi4)
    runs-on: [self-hosted, linux, ARM64, pi4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Prepare directories
        shell: bash
        run: |
          set -eu
          mkdir -p build/host build/ci build/artifacts
      - name: Bootstrap (GCC strict C89)
        shell: bash
        run: |
          set -eu
          gcc -std=c89 -pedantic-errors -Wextra -Werror -o build/host/tack src/tack.c
      - name: GCC release tests (-j 4)
        shell: bash
        env:
          TACK_CC: gcc
        run: |
          set -eu
          ./build/host/tack --config ./tack.ini test release --ci --rebuild -j 4 --events-jsonl build/ci/linux-gcc.events.jsonl --report-tap build/ci/linux-gcc.tap --report-junit build/ci/linux-gcc.junit.xml
      - name: Clang release tests (-j 4)
        shell: bash
        env:
          TACK_CC: clang
        run: |
          set -eu
          ./build/host/tack --config ./tack.ini test release --ci --rebuild -j 4 --events-jsonl build/ci/linux-clang.events.jsonl --report-tap build/ci/linux-clang.tap --report-junit build/ci/linux-clang.junit.xml
      - name: GCC/gcov coverage and HWM (-j 4)
        shell: bash
        env:
          TACK_CC: gcc
        run: |
          set -eu
          ./build/host/tack --config ./tack.ini test coverage --ci --rebuild -j 4 --events-jsonl build/ci/linux-gcov.events.jsonl --report-tap build/ci/linux-gcov.tap --report-junit build/ci/linux-gcov.junit.xml
          ./build/host/tack --config ./tack.ini coverage check
      - name: Generate BOM SBOM DOC
        shell: bash
        env:
          TACK_CC: gcc
        run: |
          set -eu
          ./build/host/tack --config ./tack.ini bom debug
          ./build/host/tack --config ./tack.ini sbom debug
          ./build/host/tack --config ./tack.ini doc debug
      - name: Collect generated artifacts
        shell: bash
        run: |
          set -eu
          cp -f build/bom.md build/artifacts/ || true
          cp -f build/bom.html build/artifacts/ || true
          cp -f build/sbom.json build/artifacts/ || true
          if [ -d build/doc ]; then
            rm -rf build/artifacts/doc
            cp -R build/doc build/artifacts/doc
          fi
      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tack-ci-linux-arm64
          path: |
            build/ci/
            build/artifacts/
          if-no-files-found: warn

  windows-x64:
    name: Windows x64 (dev-laptop)
    runs-on: [self-hosted, windows, x64, dev-laptop]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Prepare directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\host, build\ci, build\artifacts | Out-Null
      - name: Bootstrap (GCC strict C89)
        shell: pwsh
        run: |
          gcc -std=c89 -pedantic-errors -Wextra -Werror -o build\host\tack.exe src\tack.c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: TinyCC debug tests (-j 4)
        shell: pwsh
        env:
          TACK_CC: tcc
        run: |
          .\build\host\tack.exe --config .\tack.ini test debug --ci --rebuild -j 4 --events-jsonl build\ci\windows-tcc.events.jsonl --report-tap build\ci\windows-tcc.tap --report-junit build\ci\windows-tcc.junit.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: GCC release tests (-j 4)
        shell: pwsh
        env:
          TACK_CC: gcc
        run: |
          .\build\host\tack.exe --config .\tack.ini test release --ci --rebuild -j 4 --events-jsonl build\ci\windows-gcc.events.jsonl --report-tap build\ci\windows-gcc.tap --report-junit build\ci\windows-gcc.junit.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Clang/MSVC release tests (-j 4)
        shell: pwsh
        env:
          TACK_CC: clang
        run: |
          .\build\host\tack.exe --config .\tack.ini test release --ci --rebuild -j 4 --events-jsonl build\ci\windows-clang.events.jsonl --report-tap build\ci\windows-clang.tap --report-junit build\ci\windows-clang.junit.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: GCC/gcov coverage and HWM (-j 4)
        shell: pwsh
        env:
          TACK_CC: gcc
        run: |
          .\build\host\tack.exe --config .\tack.ini test coverage --ci --rebuild -j 4 --events-jsonl build\ci\windows-gcov.events.jsonl --report-tap build\ci\windows-gcov.tap --report-junit build\ci\windows-gcov.junit.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\host\tack.exe --config .\tack.ini coverage check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate BOM SBOM DOC
        shell: pwsh
        env:
          TACK_CC: gcc
        run: |
          .\build\host\tack.exe --config .\tack.ini bom debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\host\tack.exe --config .\tack.ini sbom debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\host\tack.exe --config .\tack.ini doc debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect generated artifacts
        shell: pwsh
        run: |
          if (Test-Path build\bom.md) { Copy-Item build\bom.md build\artifacts\ -Force }
          if (Test-Path build\bom.html) { Copy-Item build\bom.html build\artifacts\ -Force }
          if (Test-Path build\sbom.json) { Copy-Item build\sbom.json build\artifacts\ -Force }
          if (Test-Path build\doc) {
            if (Test-Path build\artifacts\doc) { Remove-Item build\artifacts\doc -Recurse -Force }
            Copy-Item build\doc build\artifacts\doc -Recurse -Force
          }
      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tack-ci-windows-x64
          path: |
            build/ci/
            build/artifacts/
          if-no-files-found: warn
