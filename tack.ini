
; tack.ini — tack v0.8.0-dev
; ---------------------------------------------------------------------------
; Diese Datei dokumentiert die aktuellen Default-Werte/Fallbacks aus tack.c
; und kann als „offizielle“ Start-Konfiguration mitgeliefert werden.
;
; LISTEN-FORMAT:
; - Empfehlung: Tokens per Semikolon (;) trennen (am klarsten/robustesten).
; - Zusätzlich (seit v0.6.5): Whitespace als Trenner sowie quotierte Tokens sind erlaubt
;   (z.B. "C:\Program Files\Foo\include").
; - Leerzeichen um Tokens herum sind ok.
;
; LAYERING / PRIORITÄT:
; - --config <path> (höchste Priorität)
; - tack.ini
; - tackfile.c → generiertes INI-Layer (niedriger als tack.ini)
; - Built-ins in tack.c (Fallback)
; - Compiler-Auswahl: TACK_CC > [project] compiler > Built-in-Default (tcc)
; - Compiler-Policy: [project] compiler_policy = auto|tcc|gcc|clang|generic
; - CI-Grundmodus: `tack build|run|test ... --ci` mit stabiler TACK_SUMMARY-Ausgabe
; - Maschinenebene: `tack build|run|test ... --events-jsonl FILE` schreibt tack.events.v1
;
; FLAGS (CFLAGS/DFLAGS/LFLAGS):
; - In der INI heißen sie: cflags / defines / ldflags / libs.
; - Das sind *Extra*-Tokens, die tack zu seinen internen Basis-Flags ergänzt
;   (Warnungen + Profil-Flags wie -g/-O2).
; - Zwischen Layers gilt: tack.ini *ersetzt* die per-Target-Extra-Listen aus
;   tackfile.c/built-ins (es wird nicht „zusammenaddiert“).
;   Wenn du also z.B. nur cflags setzt, setzt du damit effektiv die Extra-CFLAGS
;   dieses Targets komplett neu.
; - Achtung: Sobald ein INI-Override-Block für ein Target entsteht, sollte
;   core explizit gesetzt werden, wenn man shared core weiterhin nutzen will.
;   (Darum steht core = yes unten explizit drin.)
;
; PROFIL-SEKTIONEN:
; - Profil-spezifische Overrides per Target sind möglich:
;   [target "NAME".debug] / [target "NAME".release]
; - Erlaubte Schlüssel dort: core/includes/defines/cflags/ldflags/libs
; - Profilwerte überschreiben die Basis-Listen pro Profil.
; - Tipp: Nur das setzen, was wirklich abweichen soll (der Rest bleibt aus der Basis).
; ---------------------------------------------------------------------------

[project]
; Default (tack.c): app
default_target = app

; Default (tack.c): no
disable_auto_tools = no

; Optional: Compilerprogramm auf Repo-Ebene festlegen.
; TACK_CC (Umgebung) hat weiterhin höhere Priorität.
; compiler = tcc

; Optional: eingebaute Compiler-Policy explizit setzen.
; auto = aus Compilername ableiten (Standard)
; tcc|gcc|clang|generic = Built-in-Policy erzwingen
; compiler_policy = auto

; Priorität der Compilerwahl: TACK_CC -> [project] compiler -> Built-in-Default (tcc)
; `tack doctor` zeigt Compilerquelle, wirksame Policy und die Herkunft der Policy an.

; Standardmäßig validiert tack `id`/`bin`/`src` als sichere Projektpfade.
; Nur für bewusst kontrollierte Sonderfälle auf yes setzen oder global `--unsafe-paths` nutzen.
allow_unsafe_paths = no


[target "app"]
; src-Fallback (tack.c):
; - wenn src/app/ existiert → src/app
; - sonst → src
; Wenn du src hier explizit setzt, überschreibst du diese Auto-Logik.
src = src

; bin-Default (tack.c): app  → app.exe (Windows) / app (POSIX)
; Für tack selbst wollen wir: tack.exe / tack
bin = tack

; id-Default (tack.c): aus Target-Name abgeleitet (für "app" → "app")
; (Wenn du willst, kann man id=tack setzen, ist aber nicht der Default.)
id = app

; enabled/remove Default (tack.c): enabled=yes, remove=no
enabled = yes
remove  = no

; core-Default (tack.c built-in override): yes für "app"
core = yes

; built-in override defaults (tack.c):
; includes = src
; defines/cflags/ldflags/libs = leer
includes = src
defines  =
cflags   =
ldflags  =
libs     =

[target "app".debug]
defines = TACK_DEBUG=1

[target "app".release]
cflags = -DTACK_RELEASE=1

; Beispiel: Debug nur für ein Tool, Release nur andere Libs (auskommentiert)
;[target "tool:gen"]
;src = tools/gen
;bin = gen
;core = yes
;libs = -lws2_32
;
;[target "tool:gen".debug]
;defines = TOOL_GEN_DEBUG=1
;
;[target "tool:gen".release]
;libs = -lws2_32;-luser32
;
; Beispiel: Release-Target ohne shared core (auskommentiert)
;[target "tool:minify".release]
;core = no

[doc]
template = templates/tack_template_min.html
css      = templates/tack_doc.css

[bom]
template = templates/tack_template_min.html
css      = templates/tack_doc.css

[sbom]
; format = tack|tack-sbom-1|cyclonedx|cyclonedx-1.4|spdx|spdx-2.3
; spec_version = 1.4   ; optional override (CycloneDX/SPDX/tack-sbom)
; output = build/sbom.json
format = tack-sbom-1

; ---------------------------------------------------------------------------
; fmt (optional) – externe Formatter orchestrieren
; ---------------------------------------------------------------------------
;[fmt]
;enabled = yes
;fail_fast = yes
;defaults = auto
;rules = c
;exclude = thirdparty/**;build/**;.git/**;.fossil/**;.hg/**
;
;[fmt "c"]
;tool = clang-format
;mode = file
;include = src/**/*.c;src/**/*.h;include/**/*.h;tools/**/*.c;tools/**/*.h;tests/**/*.c;tests/**/*.h
;cmd = clang-format -i --style=file @FILE@
;requires = clang-format
