<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TACK_PAGE_TITLE}}</title>
  <!-- TACK:BEGIN HEAD_ASSETS -->
  {{TACK_HEAD_ASSETS}}
  <!-- TACK:END HEAD_ASSETS -->
</head>
<body>
<header>
  <div class="row">
    <div class="brand">{{TACK_PROJECT_TITLE}}</div>
    <div class="spacer"></div>
    <input id="tack-search" type="search" placeholder="Search (nav + headings)…" autocomplete="off" />
  </div>
</header>

<main class="wrap">
  <!-- TACK:BEGIN NAV -->
  {{TACK_NAV_HTML}}
  <!-- TACK:END NAV -->

  <article>
    <!-- TACK:BEGIN TOC -->
    {{TACK_TOC_HTML}}
    <!-- TACK:END TOC -->

    <!-- TACK:BEGIN CONTENT -->
    {{TACK_CONTENT_HTML}}
    <!-- TACK:END CONTENT -->
  </article>
</main>

<!-- TACK:BEGIN FOOTER -->
{{TACK_FOOTER_HTML}}
<!-- TACK:END FOOTER -->

<script>
/*
  tack inline search (progressive enhancement, no build-time index required)

  What it does:
  - Filters the left nav links by query
  - Shows a small "Heading results" list above content (current page only)

  Global (cross-page) search would require a generated search-index.json.
  This script tries to load ./search-index.json if present; if missing, it gracefully falls back.
*/
(function(){
  function norm(s){ return (s||"").toLowerCase().replace(/\s+/g," ").trim(); }

  var input = document.getElementById("tack-search");
  if(!input) return;

  var nav = document.getElementById("tack-nav");
  var navLinks = nav ? nav.querySelectorAll("a") : [];
  var content = document.getElementById("tack-content");

  var box = document.createElement("aside");
  box.className = "toc";
  box.style.display = "none";
  box.innerHTML = "<strong>Heading results:</strong><div id='tack-hits'></div>";
  if(content && content.parentNode){
    content.parentNode.insertBefore(box, content);
  }
  var hits = box.querySelector("#tack-hits");

  function filterNav(q){
    var nq = norm(q);
    for(var i=0;i<navLinks.length;i++){
      var a = navLinks[i];
      var t = norm(a.textContent || a.innerText);
      var ok = (nq.length===0) || (t.indexOf(nq)>=0);
      a.parentNode.style.display = ok ? "" : "none";
    }
  }

  function headingsOnPage(){
    if(!content) return [];
    var hs = content.querySelectorAll("h1,h2,h3,h4");
    var out = [];
    for(var i=0;i<hs.length;i++){
      var h = hs[i];
      var txt = (h.textContent || "").trim();
      if(!txt) continue;
      if(!h.id){
        var id = txt.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
        if(id) h.id = id;
      }
      out.push({t:txt, href:"#"+h.id});
    }
    return out;
  }

  var pageHeads = headingsOnPage();

  function escapeHtml(s){
    return (s||"")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");
  }

  function renderHeadingHits(q){
    var nq = norm(q);
    if(!hits) return;

    if(nq.length===0){
      box.style.display = "none";
      hits.innerHTML = "";
      return;
    }

    var html = "";
    var count = 0;
    for(var i=0;i<pageHeads.length && count<12;i++){
      var h = pageHeads[i];
      if(norm(h.t).indexOf(nq)>=0){
        html += "<div><a href='"+h.href+"'>"+escapeHtml(h.t)+"</a></div>";
        count++;
      }
    }

    if(html){
      hits.innerHTML = html;
      box.style.display = "";
    }else{
      hits.innerHTML = "<em>No headings on this page match.</em>";
      box.style.display = "";
    }
  }

  var globalIndex = null;
  function loadGlobalIndex(){
    var url = "search-index.json";
    try{
      fetch(url, {cache:"no-store"}).then(function(r){
        if(!r.ok) return null;
        return r.json();
      }).then(function(j){
        if(j && j.pages && j.pages.length) globalIndex = j.pages;
      }).catch(function(){});
    }catch(e){}
  }
  loadGlobalIndex();

  function renderGlobalHits(q){
    if(!globalIndex || !hits) return;
    var nq = norm(q);
    if(nq.length===0) return;

    var html = "";
    var count = 0;
    for(var i=0;i<globalIndex.length && count<12;i++){
      var p = globalIndex[i];
      var title = p.title || p.path || "page";
      var blob = norm((p.title||"")+" "+(p.headings||[]).join(" "));
      if(blob.indexOf(nq)>=0){
        html += "<div>↗ <a href='"+escapeHtml(p.path)+"'>"+escapeHtml(title)+"</a></div>";
        count++;
      }
    }
    if(html){
      hits.innerHTML += "<hr><strong>Site results:</strong>"+html;
      box.style.display = "";
    }
  }

  input.addEventListener("input", function(){
    var q = input.value || "";
    filterNav(q);
    renderHeadingHits(q);
    renderGlobalHits(q);
  });
})();
</script>
</body>
</html>
